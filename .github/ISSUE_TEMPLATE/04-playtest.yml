name: 플레이테스트 피드백
description: 플레이하면서 좋았던 점, 불편했던 점, 헷갈린 장면을 알려 주세요.
title: "[피드백] "
body:
  - type: markdown
    attributes:
      value: |
        필수 질문 두 개만 짧게 적어도 됩니다. 좋았던 점도 알려 주세요.
        버그인지 확실하지 않거나 해결 방법을 몰라도 괜찮아요. 확인 후 필요한 작업에 연결합니다.
        [작성 안내](https://github.com/inha-SquareOne/DIGETHER/blob/develop/docs/guides/ISSUE_WORKFLOW.md)
  - type: textarea
    id: situation
    attributes:
      label: 어느 장면을 플레이했나요?
      description: 무엇을 하던 중이었는지 적어 주세요.
      placeholder: 친구와 첫 탐사를 마치고 엘리베이터로 돌아가는 장면이에요.
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 어떤 점이 좋거나 불편했나요?
      description: 기억나는 장면과 그때 느낀 점을 함께 적어 주세요.
      placeholder: 돌아갈 시간이 얼마 남았는지 알기 어려웠어요. 친구가 말해줘서 급하게 돌아갔어요.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 바라는 점이 있나요? (선택)
      placeholder: 시간이 얼마 안 남으면 소리나 화면으로 알려주면 좋겠어요.
  - type: textarea
    id: environment
    attributes:
      label: 어떤 조건에서 해봤나요? (선택)
      description: 빌드 이름·맵·인원·플레이 시간 중 아는 내용만 적어 주세요.
      placeholder: 오늘 전달받은 빌드 / 갱도 / 2명 / 약 20분
  - type: textarea
    id: evidence
    attributes:
      label: 화면·영상·기록이 있나요? (선택)
      description: 여기에 붙이거나 파일을 첨부해 주세요. 비밀번호·토큰·개인 정보는 가려 주세요.
