name: 밸런스
description: 승인 전 수치 조정 제안
title: "[밸런스] "
body:
  - type: input
    id: target
    attributes:
      label: 대상 규칙·데이터 경로
      placeholder: 납부 효율 / 할당량 증가량 / 상점 가격
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: 현재 값과 상태
      description: 확정값·시험값·미정 중 어느 상태인지 함께 적어 주세요.
    validations:
      required: true
  - type: input
    id: proposed
    attributes:
      label: 제안 값
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 관찰 근거와 예상 영향
      description: 플레이테스트 인원·조건·결과와 경제·진행·다인 플레이에 미치는 영향을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: approval
    attributes:
      label: Notion 승인 근거·검증 계획
      description: 승인 대기라면 대기로 적어 주세요. 이슈 등록은 기획 승인이 아니며 승인된 Notion 개정 확인 후 구현합니다.
    validations:
      required: true
