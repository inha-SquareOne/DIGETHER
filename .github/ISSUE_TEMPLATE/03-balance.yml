name: 밸런스 변경 제안
description: 난이도, 보상, 가격이나 규칙의 조정을 제안해요.
title: "[밸런스] "
body:
  - type: markdown
    attributes:
      value: |
        필수 질문 두 개만 짧게 적어도 됩니다. 정확한 수치는 몰라도 괜찮아요.
        이슈 등록은 기획 승인이 아닙니다. 규칙·수치 변경은 Notion 승인 내용을 확인한 뒤 진행합니다.
        [작성 안내](https://github.com/inha-SquareOne/DIGETHER/blob/develop/docs/guides/ISSUE_WORKFLOW.md)
  - type: input
    id: target
    attributes:
      label: 무엇을 조정하고 싶나요?
      placeholder: 상점 장비 가격 / 몬스터 난이도 / 회수품 보상
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: 어떤 상황이었고, 어떻게 바뀌면 좋을까요?
      description: 실제 겪은 장면과 바꾸고 싶은 방향을 적어 주세요.
      placeholder: 두 명이 첫 탐사를 마쳐도 장비를 살 돈이 부족했어요. 초반에 장비를 한 번 써볼 수 있으면 좋겠어요.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: 생각해 둔 수치나 방법이 있나요? (선택)
      description: 현재 값과 제안 값, 예상하는 변화가 있으면 적어 주세요. 시험값인지도 알면 함께 적어 주세요.
  - type: textarea
    id: environment
    attributes:
      label: 어떤 조건에서 해봤나요? (선택)
      description: 빌드 이름·인원·진행 단계·시도 횟수 중 아는 내용만 적어 주세요.
      placeholder: 오늘 전달받은 빌드 / 2명 / 첫 탐사 / 3번 해봤어요.
  - type: textarea
    id: references
    attributes:
      label: 관련 기획이나 이슈가 있나요? (선택)
      description: Notion·이슈 링크를 붙여 주세요. 승인 여부를 모르면 비워 두어도 됩니다.
  - type: textarea
    id: evidence
    attributes:
      label: 화면·영상·기록이 있나요? (선택)
      description: 여기에 붙이거나 파일을 첨부해 주세요. 비밀번호·토큰·개인 정보는 가려 주세요.
