name: 작업·개선 요청
description: 새 기능, 개선, 아트·레벨·문서 작업을 요청해요.
title: "[작업] "
body:
  - type: markdown
    attributes:
      value: |
        필수 질문 두 개만 짧게 적어도 됩니다. 선택 항목은 아는 내용이 있을 때만 채워 주세요.
        [어떤 양식을 골라야 할지 모르겠다면 작성 안내를 확인해 주세요.](https://github.com/inha-SquareOne/DIGETHER/blob/develop/docs/guides/ISSUE_WORKFLOW.md)
  - type: textarea
    id: what
    attributes:
      label: 무엇을 하면 되나요?
      description: 필요한 작업이나 해결하고 싶은 문제를 적어 주세요.
      placeholder: 설정을 바꿨는데 적용됐는지 알기 어려워요. 적용됐다는 안내가 있으면 좋겠어요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 어떻게 되면 완료인가요?
      description: 화면이나 게임에서 확인할 수 있는 결과를 적어 주세요.
      placeholder: 적용 버튼을 누르면 설정이 반영되고 완료 안내가 보여요.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: 어떤 작업인가요? (선택)
      options:
        - 잘 모르겠어요
        - 게임 기능 추가·개선
        - 아트·레벨 제작
        - UI·사운드
        - 개발 환경·코드 정리·조사
        - 문서
        - 기타
  - type: textarea
    id: references
    attributes:
      label: 참고할 자료가 있나요? (선택)
      description: 관련 기획·Notion·이슈 링크나 이미지를 붙여 주세요. 기획 승인 정보는 착수 전에 확인합니다.
  - type: textarea
    id: notes
    attributes:
      label: 추가로 알려줄 내용이 있나요? (선택)
      description: 이번에 하지 않을 일, 먼저 필요한 작업, 아는 담당자·파일 경로가 있으면 적어 주세요.
      placeholder: 안내 문구만 추가해요. 버튼 디자인 변경은 이번 작업에서 제외해요.
