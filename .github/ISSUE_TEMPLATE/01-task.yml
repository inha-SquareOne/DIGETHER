name: 작업
description: 개발·아트·문서 작업 요청
title: "[작업] "
body:
  - type: input
    id: part
    attributes:
      label: 담당 파트·작업 경로
      description: 확정된 담당만 적고 미정이면 미정으로 남겨 주세요.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 목적과 변경 범위
      description: 원하는 동작과 포함할 코드·에셋·맵 경로를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 기획·요구 근거
      description: 요구 ID, Notion 원본 URL·승인 개정 또는 스냅샷 시점과 미결 사항을 적어 주세요. 해당 없으면 해당 없음으로 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건과 검증 방법
      description: 관찰 가능한 결과와 정상·실패 경로, 필요한 빌드·다인 검증을 적어 주세요. 검증 M0~M3와 제작 마일스톤은 별도입니다.
      placeholder: |
        - 두 명이 동시에 회수해도 한 명에게만 지급된다.
        - 다른 플레이어에게 비공개 금액이 복제되지 않는다.
        - 네트워크 변경은 L1~L3와 M2, 플랫폼·음성은 M3로 확인한다.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 선행 작업·에셋 예약·SVN 의존성
      description: 공유 맵·패키지 편집 예약/잠금, SVN 리비전, 결정 대기 사항을 적어 주세요.
